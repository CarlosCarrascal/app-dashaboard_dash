name: dashboard

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/dashboard/**'
      - 'packages/analitica/**'
      - 'docs/data/**'
      - '.github/workflows/dashboard.yml'
  pull_request:
    paths:
      - 'apps/dashboard/**'
      - 'packages/analitica/**'
      - 'docs/data/**'
      - '.github/workflows/dashboard.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Dash · instalación y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e packages/analitica
      - run: pip install -e 'apps/dashboard[dev]'
      - run: ruff check packages/analitica apps/dashboard
      - run: python -m compileall -q packages/analitica apps/dashboard
      - run: pytest apps/dashboard/tests -q

  image:
    name: Dash · imagen de despliegue
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: false
          tags: aquanqa-dashboard:ci
