# La plataforma de datos: el DDL y su estilo.
#
# Un workflow por módulo, en lugar de uno solo con todos los trabajos, porque el filtro `paths`
# de GitHub Actions es a nivel de workflow y no de job: es la única forma nativa de que un cambio
# en `bi/` no dispare esto (ADR-0006).
name: db

on:
  push:
    branches: [master, main]
    paths:
      - 'db/**'
      - 'scripts/**'          # run.mjs es quien aplica las capas
      - 'packages/analitica/**' # prueba de persistencia contra el PostgreSQL del workflow
      - '.github/workflows/db.yml'
  pull_request:
    paths:
      - 'db/**'
      - 'scripts/**'
      - 'packages/analitica/**'
      - '.github/workflows/db.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # El DDL se aplica de verdad sobre un PostgreSQL limpio. Es la única forma de saber que un
  # cambio de esquema no rompe nada: sin datos no se puede validar el contenido, pero sí que las
  # capas se crean en orden y que las restricciones son declarables.
  # Después de construir el esquema, este trabajo comprueba que el gate de aceptación
  # (`90_checks`) no permita pasar una base vacía y sí acepte un fixture sintético aislado.
  # La aceptación de datos reales requiere además una carga Access completa y se ejecuta
  # en el entorno de integración con sus fuentes configuradas.
  esquema:
    name: Esquema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aquanqa
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci
      PGDATABASE: aquanqa
      PGCLIENTENCODING: UTF8
    steps:
      - uses: actions/checkout@v4
      # Node solo actúa de lanzador: scripts/run.mjs no tiene dependencias npm (ADR-0006),
      # así que no hay `npm ci` ni caché que restaurar.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aplicar capas en orden
        run: |
          for dir in 00_bootstrap 10_raw 20_core 30_stg 40_qua 50_carga_core 60_dim_fact 70_reporting 80_analytics; do
            node scripts/run.mjs sql "$dir"
          done
      - name: Reejecutar 80_analytics para probar idempotencia
        run: node scripts/run.mjs sql 80_analytics
      - name: Verificar que las capas existen
        run: |
          esquemas="$(node scripts/run.mjs psql -tAc \
            "SELECT COUNT(*) FROM pg_namespace
             WHERE nspname IN ('raw','stg','qua','core','dim','fact','reporting','analytics')")"
          test "$esquemas" -eq 8
      - name: Verificar que 90_checks bloquea una base sin carga
        run: |
          if node scripts/run.mjs validate; then
            echo "El gate de contrato pasó indebidamente con una base sin datos."
            exit 1
          fi
      - name: Verificar que 90_checks acepta un fixture válido aislado
        run: node scripts/run.mjs validate-fixture
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar dependencias mínimas de integración
        run: python -m pip install pytest pandas numpy python-dotenv "psycopg[binary]"
      - name: Probar historial de claims contra PostgreSQL real
        env:
          AQUANQA_TEST_POSTGRES_DSN: postgresql://postgres:ci@localhost:5432/aquanqa
          PYTHONPATH: packages
        run: python -m pytest packages/analitica/tests/test_postgres_claim_history.py -q

  sql-lint:
    name: SQL · sqlfluff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install sqlfluff
      - run: python -m sqlfluff lint db/sql --dialect postgres
