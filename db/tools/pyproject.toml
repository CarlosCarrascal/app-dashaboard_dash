[project]
name = "aquanqa-analitica"
version = "0.1.0"
description = "Herramientas de análisis sobre el modelo de datos: SHAP, tablero de relación clima-riego / rendimiento"
requires-python = ">=3.12"
# Este paquete no expone código importable: son scripts que se ejecutan por ruta
# (`python db/tools/xxx.py`, `streamlit run db/tools/dashboard/app.py`). Existe solo para
# DECLARAR las dependencias del análisis, que hasta ahora vivían de lo que hubiera quedado
# instalado en el entorno conda — con lo cual los scripts de `db/tools/` funcionaban por
# suerte, no por contrato.
#
# Sin pyodbc ni fastapi a propósito: el análisis lee de PostgreSQL y de Excel, no del
# Access histórico ni por HTTP (ADR-0006).
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",        # lectura del Excel de campaña
    "xlsxwriter>=3.2",      # escritura del Excel de resultados, con formato
    "scipy>=1.14",          # pruebas de hipotesis del estudio climatico
    "psycopg[binary]>=3.2", # los scripts que leen el panel desde reporting
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",    # metricas y esquemas de validacion cruzada
    "xgboost>=2.1",
    "shap>=0.46",
    "matplotlib>=3.9",      # figuras de los reportes HTML
    "streamlit>=1.40",      # tablero interactivo (db/tools/dashboard/app.py)
    "plotly>=5.24",         # graficos del tablero
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Sin paquetes que descubrir: la instalación solo tiene que traer las dependencias.
[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Los módulos del tablero se importan por nombre suelto (Streamlit ejecuta `app.py` por
# ruta, no como paquete), así que hay que decirle a isort que no son de terceros.
[tool.ruff.lint.isort]
known-first-party = ["config", "datos_origen", "estilo", "nucleo", "servicios", "vistas"]
