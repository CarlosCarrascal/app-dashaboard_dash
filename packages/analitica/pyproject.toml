[project]
name = "aquanqa-analitica"
version = "0.1.0"
description = "Núcleo analítico reutilizable sobre el modelo de datos Aqu Anqa"
requires-python = ">=3.12"
# Este paquete no conoce ninguna interfaz; mantenerlo separado evita que una librería de
# cálculo arrastre un servidor web.
#
# Sin pyodbc ni fastapi a propósito: el análisis lee de PostgreSQL y de Excel, no del
# Access histórico ni por HTTP (ADR-0006).
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",        # lectura del Excel de campaña
    "xlsxwriter>=3.2",      # escritura del Excel de resultados, con formato
    "scipy>=1.14",          # pruebas de hipotesis del estudio climatico
    "psycopg[binary]>=3.2", # los scripts que leen el panel desde reporting
    "python-dotenv>=1.0",
    "joblib>=1.4",          # paralelización explícita del servicio Bhattacharya
    "scikit-learn>=1.5",    # metricas y esquemas de validacion cruzada
    "xgboost>=2.1",
    "shap>=0.46",
    "matplotlib>=3.9",      # figuras de los reportes HTML
    "plotly>=5.24",         # figuras reutilizables por las interfaces
    "statsmodels>=0.14.4",  # modelos mixtos, ARDL, HAC y pruebas múltiples
    "statsforecast>=2.0",   # baselines temporales y validación rolling-origin
    "hierarchicalforecast>=1.2", # reconciliación lote→módulo→fundo
    "mapie>=1.0",           # intervalos conformales para challengers ML
    "mlflow>=3.0",          # tracking, firmas y model registry
    "pandera[pandas]>=0.25",# contratos de DataFrame en las fronteras
    "pyarrow>=18",          # artefactos Parquet auditables
]

[project.scripts]
aquanqa-analytics = "analitica.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
]
operativo = [
    "python-calamine>=0.3",
    "pyodbc>=5.1",
]
deploy = ["gunicorn>=23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "analitica",
    "analitica.dominio.nucleo",
    "analitica.dominio",
    "analitica.dominio.compartido",
    "analitica.dominio.modelos",
    "analitica.dominio.modelos.hibrido",
    "analitica.dominio.modelos.fenologico",
    "analitica.dominio.evaluacion",
    "analitica.dominio.evaluacion.relaciones_partes",
    "analitica.aplicacion",
    "analitica.aplicacion.procesos",
    "analitica.aplicacion.procesos.candidatos",
    "analitica.aplicacion.parametros",
    "analitica.aplicacion.operativo",
    "analitica.infraestructura",
    "analitica.infraestructura.persistencia",
    "analitica.interfaces",
    "analitica.proyeccion",
    "analitica.proyeccion.horizonte",
    "analitica.aplicacion.servicios",
    "analitica.aplicacion.servicios.infraestructura",
    "analitica.interfaces.commands",
    "analitica.interfaces.scripts",
    "analitica.interfaces.visualizaciones",
]

[tool.setuptools.package-dir]
analitica = "."
"analitica.dominio.nucleo" = "dominio/nucleo"
"analitica.dominio" = "dominio"
"analitica.dominio.compartido" = "dominio/compartido"
"analitica.dominio.modelos" = "dominio/modelos"
"analitica.dominio.modelos.hibrido" = "dominio/modelos/hibrido"
"analitica.dominio.modelos.fenologico" = "dominio/modelos/fenologico"
"analitica.dominio.evaluacion" = "dominio/evaluacion"
"analitica.dominio.evaluacion.relaciones_partes" = "dominio/evaluacion/relaciones_partes"
"analitica.aplicacion" = "aplicacion"
"analitica.aplicacion.procesos" = "aplicacion/procesos"
"analitica.aplicacion.procesos.candidatos" = "aplicacion/procesos/candidatos"
"analitica.aplicacion.parametros" = "aplicacion/parametros"
"analitica.aplicacion.operativo" = "aplicacion/operativo"
"analitica.infraestructura" = "infraestructura"
"analitica.infraestructura.persistencia" = "infraestructura/persistencia"
"analitica.interfaces" = "interfaces"
"analitica.proyeccion" = "proyeccion"
"analitica.proyeccion.horizonte" = "proyeccion/horizonte"
"analitica.aplicacion.servicios" = "aplicacion/servicios"
"analitica.aplicacion.servicios.infraestructura" = "aplicacion/servicios/infraestructura"
"analitica.interfaces.commands" = "interfaces/commands"
"analitica.interfaces.scripts" = "interfaces/scripts"
"analitica.interfaces.visualizaciones" = "interfaces/visualizaciones"

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.py[cod]"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["build", "dist*", ".cache", ".tmp*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["analitica"]
